<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>키오스크 연습</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#EFE9DF; --ink:#24201B; --sub:#6B6358; --line:#DDD4C6;
  --panel:#FFFDF9; --body:#2E2A26; --screen:#FFFFFF;
  --accent:#D9532B; --accent-ink:#FFFFFF; --accent-soft:#FBE7DF;
  --ok:#2F7D4F; --ok-soft:#E3F2E8; --warn:#B3261E;
  --glow:#FFC93C; --guide-bg:#FFF4CC; --guide-ink:#4A3800;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}

.wrap{min-height:100vh;display:grid;grid-template-columns:auto minmax(280px,380px);gap:28px;justify-content:center;align-items:center;padding:16px}
@media (max-width:860px){.wrap{grid-template-columns:1fr;justify-items:center;gap:16px}}

/* ── 키오스크 본체 ── */
.device{width:min(92vw,calc((100vh - 32px)*0.64));max-width:620px;aspect-ratio:9/14.2;background:var(--body);border-radius:3.2vh;padding:2.2%;box-shadow:0 18px 40px rgba(60,40,20,.25);display:flex;flex-direction:column}
@media (max-width:860px){.device{width:min(100%,520px);aspect-ratio:auto;height:min(calc(100vh - 32px),860px)}}
.screen{flex:1;background:var(--screen);border-radius:1.6vh;overflow:hidden;position:relative;container-type:inline-size;display:flex;flex-direction:column;min-height:0}
.k{font-size:4.2cqw;display:flex;flex-direction:column;height:100%;min-height:0}
.big .k{font-size:4.9cqw}

.k-head{display:flex;align-items:center;justify-content:space-between;padding:3cqw 4cqw;background:var(--body);color:#fff;gap:2cqw}
.brand{font-weight:800;font-size:1.15em;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:.62em;opacity:.7;letter-spacing:0}
.home-btn{background:#fff;color:var(--body);border-radius:999px;padding:1.6cqw 3.4cqw;font-weight:700;font-size:.85em;white-space:nowrap}

.steps{display:flex;gap:1.2cqw;padding:2.4cqw 4cqw;background:#F6F2EC;border-bottom:1px solid var(--line)}
.steps span{flex:1;text-align:center;font-size:.7em;font-weight:700;color:#A79D8F;padding:1.2cqw 0;border-radius:1.4cqw;background:#ECE6DC}
.steps span.on{background:var(--accent);color:#fff}
.steps span.done{background:#D8CFC2;color:#5A5248}

.k-body{flex:1;overflow:auto;min-height:0;position:relative}
.pad{padding:5cqw}
.title{font-size:1.45em;font-weight:800;letter-spacing:-.03em;margin:0 0 1.5cqw;line-height:1.3}
.desc{color:var(--sub);margin:0 0 5cqw;line-height:1.5}

/* 시작 화면 */
.start{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4cqw;padding:6cqw;background:linear-gradient(180deg,#FFF8EE,#F6E3D3)}
.start .cup{font-size:5em;line-height:1}
.start h1{font-size:1.9em;margin:0;letter-spacing:-.04em}
.start p{margin:0;color:var(--sub);font-size:1em}
.touch{margin-top:4cqw;background:var(--accent);color:#fff;font-size:1.3em;font-weight:800;padding:5cqw 9cqw;border-radius:4cqw;box-shadow:0 1.4cqw 0 #A63B1C}

/* 큰 선택 버튼 */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:4cqw}
.choice{background:#F7F3ED;border:.6cqw solid var(--line);border-radius:4cqw;padding:7cqw 3cqw;display:flex;flex-direction:column;align-items:center;gap:3cqw;font-size:1.2em;font-weight:800}
.choice .ico{font-size:2.6em;line-height:1}
.choice small{font-weight:500;font-size:.62em;color:var(--sub)}

/* 메뉴 */
.cats{display:flex;gap:2cqw;padding:3cqw 4cqw;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:2}
.cat{flex:1;padding:3cqw 0;border-radius:2.4cqw;background:#F1ECE4;font-weight:800;font-size:.95em;color:#6B6358}
.cat.on{background:var(--body);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;padding:4cqw}
.item{background:#FAF7F2;border:.5cqw solid var(--line);border-radius:3.4cqw;padding:4cqw 2cqw 3.4cqw;display:flex;flex-direction:column;align-items:center;gap:1.4cqw}
.item .em{font-size:2.6em;line-height:1.1}
.item b{font-size:.98em;letter-spacing:-.02em}
.item span{font-size:.85em;color:var(--accent);font-weight:800}
.item .tag{font-size:.62em;color:var(--sub);font-weight:600}

/* 장바구니 */
.cart{border-top:1px solid var(--line);background:#F6F2EC;padding:2.6cqw 4cqw 3.4cqw}
.cart-list{max-height:22cqw;overflow:auto;display:flex;flex-direction:column;gap:1.4cqw;margin-bottom:2.4cqw}
.cart-empty{color:var(--sub);font-size:.82em;text-align:center;padding:2cqw 0 3cqw}
.line{display:flex;align-items:center;gap:2cqw;background:#fff;border-radius:2cqw;padding:1.8cqw 2.4cqw;font-size:.8em}
.line .nm{flex:1;font-weight:700;line-height:1.3}
.line .nm small{display:block;color:var(--sub);font-weight:500}
.line .pr{font-weight:800;white-space:nowrap}
.x{width:7cqw;height:7cqw;border-radius:50%;background:#EADFD3;font-weight:800;font-size:1em;flex:none}
.cart-foot{display:flex;align-items:center;gap:3cqw}
.total{flex:1;font-size:.85em;color:var(--sub)}
.total b{display:block;color:var(--ink);font-size:1.4em;letter-spacing:-.02em}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.1em;padding:3.6cqw 6cqw;border-radius:3cqw}
.primary:disabled{background:#CFC6BA;color:#fff;cursor:default}
.ghost{background:#EDE6DC;font-weight:700;font-size:1em;padding:3.6cqw 5cqw;border-radius:3cqw}

/* 옵션 창 */
.modal{position:absolute;inset:0;background:rgba(30,24,18,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;border-radius:5cqw 5cqw 0 0;padding:5cqw;max-height:92%;overflow:auto}
.sheet-head{display:flex;align-items:center;gap:3cqw;margin-bottom:4cqw}
.sheet-head .em{font-size:2.6em}
.sheet-head b{font-size:1.25em;display:block}
.sheet-head span{color:var(--accent);font-weight:800}
.opt{margin-bottom:4cqw}
.opt h4{margin:0 0 2cqw;font-size:.9em;color:var(--sub)}
.opt-row{display:flex;gap:2.4cqw}
.opt-btn{flex:1;padding:3.4cqw 1cqw;border-radius:2.6cqw;border:.6cqw solid var(--line);background:#FAF7F2;font-weight:800;font-size:.95em}
.opt-btn small{display:block;font-weight:600;font-size:.72em;color:var(--sub);margin-top:.6cqw}
.opt-btn.on{border-color:var(--accent);background:var(--accent-soft);color:#8E3013}
.opt-btn.hot.on{border-color:#C0392B;background:#FDE3DF}
.opt-btn.ice.on{border-color:#2F6FB3;background:#E2EEFA;color:#1D4C80}
.qty{display:flex;align-items:center;justify-content:center;gap:6cqw}
.qty button{width:13cqw;height:13cqw;border-radius:50%;background:#EDE6DC;font-size:1.6em;font-weight:800}
.qty b{font-size:1.6em;min-width:10cqw;text-align:center}
.sheet-foot{display:flex;gap:3cqw;margin-top:5cqw}
.sheet-foot .primary{flex:2}
.sheet-foot .ghost{flex:1}

/* 확인·결제 */
.rows{display:flex;flex-direction:column;gap:2cqw;margin-bottom:4cqw}
.row{display:flex;justify-content:space-between;gap:3cqw;background:#FAF7F2;border-radius:2.4cqw;padding:3cqw 3.4cqw;font-size:.92em}
.row small{display:block;color:var(--sub)}
.sum{display:flex;justify-content:space-between;align-items:baseline;border-top:.5cqw solid var(--ink);padding-top:3cqw;margin-bottom:5cqw;font-weight:800}
.sum b{font-size:1.5em;color:var(--accent)}
.btn-row{display:flex;gap:3cqw}
.btn-row>*{flex:1}
.pays{display:grid;grid-template-columns:1fr;gap:3cqw}
.pays .choice{flex-direction:row;justify-content:flex-start;padding:5cqw;gap:4cqw;font-size:1.1em}
.pays .choice .ico{font-size:1.8em}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;margin:3cqw 0 4cqw}
.keypad button{background:#F1ECE4;border-radius:2.4cqw;padding:3.6cqw 0;font-size:1.3em;font-weight:800}
.phone{text-align:center;font-size:1.5em;font-weight:800;letter-spacing:.08em;background:#FAF7F2;border-radius:2.4cqw;padding:3.4cqw;min-height:1.6em}

.slot-wrap{display:flex;flex-direction:column;align-items:center;gap:4cqw;padding:4cqw 0}
.slot{width:62cqw;height:30cqw;background:#3A3530;border-radius:3cqw;position:relative;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.slot::before{content:"";position:absolute;bottom:5cqw;left:12cqw;right:12cqw;height:2.2cqw;background:#111;border-radius:2cqw}
.card{position:absolute;bottom:6cqw;width:36cqw;height:22cqw;border-radius:2cqw;background:linear-gradient(135deg,#4C7DBE,#2A4E85);box-shadow:0 1cqw 2cqw rgba(0,0,0,.3);animation:insert 1.8s ease-in-out infinite}
.card::after{content:"";position:absolute;left:4cqw;top:5cqw;width:7cqw;height:5cqw;background:#E8C66A;border-radius:1cqw}
@keyframes insert{0%{transform:translateY(-14cqw)}55%,100%{transform:translateY(4cqw)}}
.slot.paying .card{animation:none;transform:translateY(4cqw)}
.spinner{width:12cqw;height:12cqw;border:1.6cqw solid #EADFD3;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.done{text-align:center;padding:6cqw 5cqw}
.num{font-size:4.4em;font-weight:900;color:var(--accent);letter-spacing:-.04em;line-height:1;margin:3cqw 0}
.result{border-radius:3cqw;padding:4cqw;margin-top:5cqw;text-align:left;font-size:.92em;line-height:1.55}
.result.ok{background:var(--ok-soft);color:#1E5434}
.result.no{background:#FCE8E6;color:#7A1E17}
.result b{font-size:1.1em}

/* 안내 띠 + 반짝임 */
.guide{background:var(--guide-bg);color:var(--guide-ink);padding:3cqw 4cqw;font-weight:700;font-size:.92em;line-height:1.4;display:flex;gap:2.4cqw;align-items:flex-start;border-top:.5cqw solid #F2DC8C}
.guide .gi{font-size:1.2em;line-height:1.1}
.hl{position:relative;z-index:3;animation:glow 1.1s ease-in-out infinite;outline:1.2cqw solid var(--glow);outline-offset:.6cqw}
@keyframes glow{0%,100%{outline-color:rgba(255,201,60,1)}50%{outline-color:rgba(255,201,60,.25)}}

.toast{position:absolute;left:50%;bottom:24cqw;transform:translateX(-50%);background:rgba(36,32,27,.92);color:#fff;padding:3cqw 5cqw;border-radius:3cqw;font-weight:700;font-size:.9em;z-index:40;width:max-content;max-width:86%;text-align:center}
.alert{position:absolute;inset:0;background:rgba(30,24,18,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:6cqw}
.alert-box{background:#fff;border-radius:4cqw;padding:6cqw;text-align:center;width:100%}
.alert-box .cd{font-size:3em;font-weight:900;color:var(--warn);margin:2cqw 0}

/* ── 오른쪽 선생님 패널 ── */
.side{background:var(--panel);border-radius:20px;padding:22px;box-shadow:0 6px 20px rgba(60,40,20,.08);width:100%;max-width:520px}
.side h2{margin:0 0 4px;font-size:22px;letter-spacing:-.03em}
.side .lead{margin:0 0 18px;color:var(--sub);font-size:14px;line-height:1.5}
.sec{margin-bottom:18px}
.sec h3{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:700}
.seg{display:flex;background:#EFE8DD;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:9px;font-weight:700;font-size:15px;color:#6B6358}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{font-size:13px;color:var(--sub);margin:6px 2px 0;line-height:1.45}
.missions{display:flex;flex-direction:column;gap:8px}
.mis{text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:600;line-height:1.4}
.mis small{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:2px}
.mis.on{border-color:var(--accent);background:var(--accent-soft)}
.toggles{display:flex;flex-direction:column;gap:8px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:15px;font-weight:600}
.sw{width:44px;height:26px;border-radius:13px;background:#CFC6BA;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg.on .sw{background:var(--ok)}
.tg.on .sw::after{left:21px}
.now{background:#24201B;color:#fff;border-radius:14px;padding:14px 16px}
.now small{opacity:.65;font-size:12px;font-weight:700}
.now p{margin:4px 0 0;font-size:16px;font-weight:700;line-height:1.45}
.reset{width:100%;margin-top:14px;padding:12px;border-radius:12px;background:#EDE6DC;font-weight:700;font-size:15px}
@media (min-width:861px){.wrap{height:100vh}.side{max-height:calc(100vh - 32px);overflow:auto}}
@media (max-width:860px){.side{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="device"><div class="screen" id="screen"></div></div>

  <aside class="side">
    <h2>키오스크 주문 연습</h2>
    <p class="lead">카페 키오스크로 주문하는 과정을 처음부터 끝까지 따라 해 보는 연습 화면이에요. 실제로 결제되지 않아요.</p>

    <div class="sec">
      <h3>연습 방식</h3>
      <div class="seg" id="modeSeg">
        <button data-mode="practice">연습 모드</button>
        <button data-mode="real">실전 모드</button>
      </div>
      <p class="hint" id="modeHint"></p>
    </div>

    <div class="sec">
      <h3>미션</h3>
      <div class="missions" id="missions"></div>
    </div>

    <div class="sec">
      <h3>화면 설정</h3>
      <div class="toggles">
        <button class="tg" id="tgVoice"><span>🔊 음성 안내</span><span class="sw"></span></button>
        <button class="tg" id="tgBig"><span>🔍 글씨 크게</span><span class="sw"></span></button>
      </div>
    </div>

    <div class="now"><small>지금 할 일</small><p id="nowText"></p></div>
    <button class="reset" id="resetBtn">↺ 처음부터 다시</button>
  </aside>
</div>

<script>
/* ───── 메뉴 ───── */
const CATS=[{id:'coffee',name:'커피'},{id:'drink',name:'음료'},{id:'dessert',name:'디저트'}];
const MENU=[
  {id:'americano',cat:'coffee',name:'아메리카노',price:2000,em:'☕',temp:['HOT','ICE'],size:true,shot:true},
  {id:'latte',cat:'coffee',name:'카페라테',price:2800,em:'🥛',temp:['HOT','ICE'],size:true,shot:true},
  {id:'vanilla',cat:'coffee',name:'바닐라라테',price:3300,em:'🍮',temp:['HOT','ICE'],size:true,shot:true},
  {id:'cappuccino',cat:'coffee',name:'카푸치노',price:3000,em:'☕',temp:['HOT'],size:true,shot:true},
  {id:'smoothie',cat:'drink',name:'딸기 스무디',price:3800,em:'🍓',temp:['ICE'],size:true},
  {id:'lemonade',cat:'drink',name:'레몬에이드',price:3500,em:'🍋',temp:['ICE'],size:true},
  {id:'greentea',cat:'drink',name:'녹차라테',price:3300,em:'🍵',temp:['HOT','ICE'],size:true},
  {id:'choco',cat:'drink',name:'핫초코',price:3000,em:'🍫',temp:['HOT'],size:true},
  {id:'cheesecake',cat:'dessert',name:'치즈케이크',price:4500,em:'🍰'},
  {id:'cookie',cat:'dessert',name:'초코쿠키',price:2000,em:'🍪'},
  {id:'croissant',cat:'dessert',name:'크루아상',price:3200,em:'🥐'},
  {id:'waffle',cat:'dessert',name:'와플',price:3800,em:'🧇'}
];
const SIZE_UP=500, SHOT=500;
const byId=id=>MENU.find(m=>m.id===id);

/* ───── 미션 ───── */
const MISSIONS=[
  {id:'free',label:'자유 주문',text:'먹고 싶은 메뉴를 마음대로 골라 주문해 보세요.'},
  {id:'m1',label:'미션 1 · 쉬움',text:'아이스 아메리카노 1잔, 큰 사이즈로, 포장해 가기',place:'togo',items:[{id:'americano',temp:'ICE',size:'L',qty:1}]},
  {id:'m2',label:'미션 2 · 보통',text:'따뜻한 카페라테 2잔, 매장에서 먹고 가기',place:'here',items:[{id:'latte',temp:'HOT',size:'R',qty:2}]},
  {id:'m3',label:'미션 3 · 어려움',text:'딸기 스무디 1잔과 치즈케이크 1개, 포장해 가기',place:'togo',items:[{id:'smoothie',temp:'ICE',size:'R',qty:1},{id:'cheesecake',temp:null,size:null,qty:1}]}
];

/* ───── 상태 ───── */
const S={mode:'practice',mission:'m1',voice:true,big:false,
  screen:'start',place:null,cat:'coffee',cart:[],modal:null,phone:'',
  t0:0,removes:0,orderNo:0,alert:null};
const $=s=>document.querySelector(s);
const won=n=>n.toLocaleString('ko-KR')+'원';
const M=()=>MISSIONS.find(m=>m.id===S.mission);

function linePrice(l){const it=byId(l.id);return (it.price+(l.size==='L'?SIZE_UP:0)+(l.shot?SHOT:0))*l.qty}
function lineDesc(l){const p=[];if(l.temp)p.push(l.temp==='HOT'?'따뜻하게':'차갑게');if(l.size)p.push(l.size==='L'?'큰 사이즈':'기본 사이즈');if(l.shot)p.push('샷 추가');return p.join(' · ')}
const total=()=>S.cart.reduce((a,l)=>a+linePrice(l),0);
const count=()=>S.cart.reduce((a,l)=>a+l.qty,0);
const missionName=it=>{const m=byId(it.id);return (it.temp==='ICE'&&m.temp?.length>1?'아이스 ':it.temp==='HOT'&&m.temp?.length>1?'따뜻한 ':'')+m.name};

/* 미션과 장바구니 비교 */
function cartCheck(){
  const m=M(); if(!m.items) return {missing:null,wrong:null,ok:S.cart.length>0};
  const wrong=S.cart.find(l=>!m.items.some(w=>w.id===l.id&&w.temp===l.temp&&w.size===l.size&&!l.shot&&l.qty<=w.qty))||
              S.cart.find(l=>{const w=m.items.find(w=>w.id===l.id);return w&&(l.qty>w.qty)});
  const missing=m.items.find(w=>!S.cart.some(l=>l.id===w.id&&l.temp===w.temp&&l.size===w.size&&!l.shot&&l.qty===w.qty));
  return {missing,wrong,ok:!missing&&!wrong};
}

/* ───── 화면 그리기 ───── */
const STEPS=['매장/포장','메뉴 선택','주문 확인','결제'];
const STEP_OF={place:0,menu:1,confirm:2,point:2,pay:3,card:3,paying:3,receipt:3,done:4};

function head(){
  const st=STEP_OF[S.screen];
  return `<div class="k-head"><div class="brand">새싹 카페<small>주문하는 곳</small></div><button class="home-btn" id="btnHome">처음으로</button></div>
  <div class="steps">${STEPS.map((s,i)=>`<span class="${i===st?'on':i<st?'done':''}">${i+1}. ${s}</span>`).join('')}</div>`;
}

function render(){
  const g=guide();
  let h='';
  if(S.screen==='start'){
    h=`<div class="start"><div class="cup">☕</div><h1>새싹 카페</h1><p>어서 오세요!<br>화면을 눌러 주문을 시작하세요.</p><button class="touch" id="btnStart">주문 시작하기</button></div>`;
  }else{
    h=head()+`<div class="k-body">${body()}</div>`;
    if(S.screen==='menu') h+=cartBar();
  }
  if(S.mode==='practice'&&S.screen!=='start'&&g.text) h+=`<div class="guide"><span class="gi">👉</span><span>${g.text}</span></div>`;
  if(S.modal) h+=modal();
  if(S.alert) h+=`<div class="alert"><div class="alert-box"><div class="title">계속 주문하시겠어요?</div><p class="desc" style="margin:0">아무것도 누르지 않으면 처음 화면으로 돌아가요.</p><div class="cd" id="cd">${S.alert.left}</div><button class="primary" style="width:100%" id="btnKeep">계속 주문하기</button></div></div>`;
  const k=$('#screen'); k.innerHTML=`<div class="k">${h}</div>`;
  k.parentElement.classList.toggle('big',S.big);
  if(S.mode==='practice'&&g.target){const t=k.querySelector(g.target);if(t){t.classList.add('hl');t.scrollIntoView({block:'nearest'})}}
  if(S.mode==='practice'&&S.screen==='start'){$('#btnStart')?.classList.add('hl')}
  $('#nowText').textContent=g.side||g.plain||'';
  speak(g.say||g.plain);
  sidePanel();
}

function body(){
  const m=M();
  switch(S.screen){
  case 'place':
    return `<div class="pad"><p class="title">어디에서 드시겠어요?</p><p class="desc">매장에서 드시면 컵에, 포장하시면 테이크아웃 잔에 담아 드려요.</p>
    <div class="choices"><button class="choice" data-place="here"><span class="ico">🪑</span>매장에서 먹기<small>가게 안에서</small></button>
    <button class="choice" data-place="togo"><span class="ico">🛍️</span>포장하기<small>가지고 가기</small></button></div></div>`;
  case 'menu':
    return `<div class="cats">${CATS.map(c=>`<button class="cat ${S.cat===c.id?'on':''}" data-cat="${c.id}">${c.name}</button>`).join('')}</div>
    <div class="grid">${MENU.filter(x=>x.cat===S.cat).map(x=>`<button class="item" data-item="${x.id}"><span class="em">${x.em}</span><b>${x.name}</b><span>${won(x.price)}</span>${x.temp?`<span class="tag">${x.temp.length>1?'HOT · ICE':x.temp[0]+' 전용'}</span>`:''}</button>`).join('')}</div>`;
  case 'confirm':
    return `<div class="pad"><p class="title">주문 내용을 확인해 주세요</p><p class="desc">${S.place==='here'?'🪑 매장에서 먹기':'🛍️ 포장하기'}</p>
    <div class="rows">${S.cart.map(l=>`<div class="row"><div><b>${byId(l.id).name} × ${l.qty}</b>${lineDesc(l)?`<small>${lineDesc(l)}</small>`:''}</div><b>${won(linePrice(l))}</b></div>`).join('')}</div>
    <div class="sum"><span>결제할 금액</span><b>${won(total())}</b></div>
    <div class="btn-row"><button class="ghost" id="btnBack">메뉴 더 고르기</button><button class="primary" id="btnConfirm">결제하기</button></div></div>`;
  case 'point':
    return `<div class="pad"><p class="title">포인트를 적립하시겠어요?</p><p class="desc">휴대폰 번호로 적립할 수 있어요. 적립하지 않아도 주문은 그대로 돼요.</p>
    ${S.phone!==null&&S.phoneOpen?`<div class="phone" id="phone">${fmtPhone(S.phone)||'&nbsp;'}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9,'지움',0,'확인'].map(k=>`<button data-key="${k}" ${k==='확인'?'id="btnKeyOk"':''}>${k}</button>`).join('')}</div>`:
    `<div class="choices"><button class="choice" id="btnPointYes"><span class="ico">📱</span>적립하기</button><button class="choice" id="btnPointNo"><span class="ico">✋</span>적립 안 함</button></div>`}</div>`;
  case 'pay':
    return `<div class="pad"><p class="title">결제 방법을 골라 주세요</p><p class="desc">결제할 금액 <b style="color:var(--accent)">${won(total())}</b></p>
    <div class="pays"><button class="choice" data-pay="card"><span class="ico">💳</span>신용·체크카드</button>
    <button class="choice" data-pay="qr"><span class="ico">📲</span>간편결제 (휴대폰)</button>
    <button class="choice" data-pay="coupon"><span class="ico">🎟️</span>쿠폰 · 상품권</button></div></div>`;
  case 'card':
    return `<div class="pad" style="text-align:center"><p class="title">카드를 넣어 주세요</p><p class="desc">키오스크 아래쪽 카드 넣는 곳에 카드를 꽂아 주세요.<br>금색 칩이 위로, 안쪽으로 가게 넣어요.</p>
    <div class="slot-wrap"><button class="slot" id="cardSlot" aria-label="카드 넣기"><span class="card"></span></button><p class="desc" style="margin:0">↑ 카드 넣는 곳을 눌러 보세요</p></div></div>`;
  case 'paying':
    return `<div class="pad" style="text-align:center"><p class="title">결제하고 있어요</p><p class="desc">결제가 끝날 때까지 카드를 빼지 마세요.</p>
    <div class="slot-wrap"><div class="slot paying"><span class="card"></span></div><div class="spinner"></div></div></div>`;
  case 'receipt':
    return `<div class="pad"><p class="title">결제가 끝났어요.<br>카드를 빼 주세요.</p><p class="desc">영수증이 필요하신가요?</p>
    <div class="choices"><button class="choice" data-rcpt="1"><span class="ico">🧾</span>영수증 출력</button><button class="choice" data-rcpt="0"><span class="ico">🙅</span>출력 안 함</button></div></div>`;
  case 'done':{
    const r=result();
    return `<div class="done"><p class="title">주문이 완료되었어요!</p><p class="desc" style="margin:0">주문 번호</p><div class="num">${S.orderNo}</div>
    <p class="desc">화면에 이 번호가 나오거나 불리면<br>카운터에서 받아 가세요.</p>
    <div class="result ${r.ok?'ok':'no'}">${r.html}</div>
    <div class="btn-row" style="margin-top:5cqw"><button class="primary" id="btnAgain">다시 연습하기</button></div></div>`;}
  }
  return '';
}

function cartBar(){
  return `<div class="cart"><div class="cart-list">${S.cart.length?S.cart.map((l,i)=>`<div class="line"><div class="nm">${byId(l.id).name} × ${l.qty}${lineDesc(l)?`<small>${lineDesc(l)}</small>`:''}</div><span class="pr">${won(linePrice(l))}</span><button class="x" data-rm="${i}" aria-label="빼기">✕</button></div>`).join(''):`<div class="cart-empty">고른 메뉴가 여기에 담겨요</div>`}</div>
  <div class="cart-foot"><div class="total">${count()}개 담음<b>${won(total())}</b></div><button class="primary" id="btnOrder" ${S.cart.length?'':'disabled'}>주문하기</button></div></div>`;
}

function modal(){
  const d=S.modal, it=byId(d.id);
  const price=(it.price+(d.size==='L'?SIZE_UP:0)+(d.shot?SHOT:0))*d.qty;
  let o='';
  if(it.temp) o+=`<div class="opt"><h4>① 온도를 골라 주세요</h4><div class="opt-row">${it.temp.map(t=>`<button class="opt-btn ${t==='HOT'?'hot':'ice'} ${d.temp===t?'on':''}" data-temp="${t}">${t==='HOT'?'🔥 따뜻하게':'🧊 차갑게'}<small>${t}</small></button>`).join('')}</div></div>`;
  if(it.size) o+=`<div class="opt"><h4>${it.temp?'②':'①'} 크기를 골라 주세요</h4><div class="opt-row"><button class="opt-btn ${d.size==='R'?'on':''}" data-size="R">기본 사이즈<small>+0원</small></button><button class="opt-btn ${d.size==='L'?'on':''}" data-size="L">큰 사이즈<small>+${won(SIZE_UP)}</small></button></div></div>`;
  if(it.shot) o+=`<div class="opt"><h4>추가 (안 골라도 돼요)</h4><div class="opt-row"><button class="opt-btn ${d.shot?'on':''}" data-shot="1">에스프레소 샷 추가<small>+${won(SHOT)}</small></button></div></div>`;
  o+=`<div class="opt"><h4>몇 개 드릴까요?</h4><div class="qty"><button id="qtyMinus" aria-label="하나 빼기">−</button><b>${d.qty}</b><button id="qtyPlus" aria-label="하나 더">+</button></div></div>`;
  const need=it.temp&&!d.temp;
  return `<div class="modal" id="modalBg"><div class="sheet"><div class="sheet-head"><span class="em">${it.em}</span><div><b>${it.name}</b><span>${won(price)}</span></div></div>${o}
  <div class="sheet-foot"><button class="ghost" id="btnCancel">취소</button><button class="primary" id="btnAdd" ${need?'disabled':''}>${need?'온도를 먼저 골라 주세요':'장바구니에 담기'}</button></div></div></div>`;
}

/* ───── 안내 (연습 모드에서 다음에 누를 곳을 알려 줌) ───── */
function guide(){
  const m=M(), mis=!!m.items;
  switch(S.screen){
  case 'start': return {plain:'화면 가운데 "주문 시작하기" 버튼을 눌러 주문을 시작해요.',say:'주문 시작하기 버튼을 눌러 보세요.'};
  case 'place':{
    if(mis){const t=m.place==='here'?'매장에서 먹기':'포장하기';return {text:`미션은 <b>${t}</b>예요. "${t}" 버튼을 눌러 보세요.`,plain:`먼저 매장에서 먹을지 포장할지 골라요. 미션은 ${t}예요.`,target:`[data-place="${m.place}"]`}}
    return {text:'가게에서 드실지, 가지고 가실지 골라 주세요.',plain:'먼저 매장에서 먹을지 포장할지 골라요.'};}
  case 'menu':{
    if(S.modal) return modalGuide();
    if(!mis){
      if(!S.cart.length) return {text:'위쪽 커피·음료·디저트를 눌러 종류를 바꾸고, 먹고 싶은 메뉴 그림을 눌러 보세요.',plain:'메뉴 그림을 눌러 골라요. 위쪽 칸을 누르면 종류가 바뀌어요.'};
      return {text:'더 고를 게 없으면 오른쪽 아래 <b>주문하기</b>를 눌러요.',plain:'다 골랐으면 주문하기 버튼을 눌러요.',target:'#btnOrder'};}
    const c=cartCheck();
    if(c.wrong){const i=S.cart.indexOf(c.wrong);return {text:`장바구니에 미션과 다른 메뉴가 들어 있어요. 옆의 <b>✕</b>를 눌러 빼 보세요.`,plain:'잘못 담은 메뉴는 장바구니에서 ✕를 눌러 뺄 수 있어요.',target:`[data-rm="${i}"]`}}
    if(c.missing){const it=byId(c.missing.id);
      if(S.cat!==it.cat){const cn=CATS.find(x=>x.id===it.cat).name;return {text:`${it.name}는 <b>${cn}</b> 칸에 있어요. 위쪽 "${cn}"를 눌러 보세요.`,plain:`${it.name}를 찾으려면 위쪽 ${cn} 칸을 눌러요.`,target:`[data-cat="${it.cat}"]`}}
      return {text:`<b>${it.name}</b> 그림을 눌러 보세요.`,plain:`${it.name}를 눌러 골라요.`,target:`[data-item="${it.id}"]`}}
    return {text:'미션 메뉴를 모두 담았어요! 오른쪽 아래 <b>주문하기</b>를 눌러요.',plain:'다 담았으면 주문하기 버튼을 눌러요.',target:'#btnOrder'};}
  case 'confirm':{
    if(mis&&!cartCheck().ok) return {text:'주문 내용이 미션과 달라요. <b>메뉴 더 고르기</b>를 눌러 고쳐 보세요.',plain:'주문 내용이 다르면 메뉴 더 고르기로 돌아가 고칠 수 있어요.',target:'#btnBack'};
    return {text:'고른 메뉴와 금액이 맞는지 확인하고 <b>결제하기</b>를 눌러요.',plain:'주문 내용과 금액을 확인한 뒤 결제하기를 눌러요.',target:'#btnConfirm'};}
  case 'point':
    if(S.phoneOpen) return {text:'번호를 누르고 <b>확인</b>을 눌러요. 아무 번호나 눌러도 괜찮아요.',plain:'휴대폰 번호를 누르고 확인을 눌러요.',target:S.phone.length>=10?'#btnKeyOk':null};
    return {text:'포인트 적립은 안 해도 돼요. <b>적립 안 함</b>을 눌러 넘어가요.',plain:'포인트 적립 화면이에요. 필요 없으면 적립 안 함을 눌러요.',target:'#btnPointNo'};
  case 'pay': return {text:'이번에는 카드로 결제해 볼게요. <b>신용·체크카드</b>를 눌러요.',plain:'결제 방법을 골라요. 카드로 결제해 봐요.',target:'[data-pay="card"]'};
  case 'card': return {text:'실제 키오스크에서는 아래쪽 구멍에 카드를 꽂아요. 지금은 <b>카드 그림</b>을 눌러 보세요.',plain:'카드를 키오스크 아래 카드 넣는 곳에 꽂아요.',target:'#cardSlot'};
  case 'paying': return {text:'결제 중이에요. 잠시 기다려 주세요.',plain:'결제 중에는 카드를 빼지 말고 기다려요.'};
  case 'receipt': return {text:'카드를 빼고, 영수증이 필요한지 골라요. 둘 중 아무거나 눌러도 돼요.',plain:'결제가 끝나면 카드를 빼고 영수증 출력 여부를 골라요.',target:null};
  case 'done': return {text:'주문 번호를 꼭 기억해 두세요!',plain:'주문 번호가 불리면 카운터에서 받아 가요.'};
  }
  return {};
}
function modalGuide(){
  const d=S.modal, m=M(), it=byId(d.id);
  if(!m.items){
    if(it.temp&&!d.temp) return {text:'먼저 <b>따뜻하게</b>와 <b>차갑게</b> 중 하나를 골라요.',plain:'음료는 온도를 먼저 골라야 담을 수 있어요.'};
    return {text:'옵션을 다 골랐으면 <b>장바구니에 담기</b>를 눌러요.',plain:'옵션을 고르고 장바구니에 담기를 눌러요.',target:'#btnAdd'};}
  const w=m.items.find(x=>x.id===d.id);
  if(!w) return {text:'이 메뉴는 미션에 없어요. <b>취소</b>를 눌러 돌아가요.',plain:'미션에 없는 메뉴예요. 취소를 눌러요.',target:'#btnCancel'};
  if(w.temp&&d.temp!==w.temp) return {text:`미션은 <b>${w.temp==='ICE'?'차갑게(ICE)':'따뜻하게(HOT)'}</b>예요.`,plain:`온도를 ${w.temp==='ICE'?'차갑게':'따뜻하게'} 골라요.`,target:`[data-temp="${w.temp}"]`};
  if(w.size&&d.size!==w.size) return {text:`미션은 <b>${w.size==='L'?'큰 사이즈':'기본 사이즈'}</b>예요.`,plain:`크기를 ${w.size==='L'?'큰 사이즈':'기본 사이즈'}로 골라요.`,target:`[data-size="${w.size}"]`};
  if(d.shot) return {text:'샷 추가는 미션에 없어요. 한 번 더 눌러 꺼 보세요.',plain:'샷 추가를 다시 눌러 빼요.',target:'[data-shot]'};
  if(d.qty<w.qty) return {text:`${w.qty}개가 필요해요. <b>+</b>를 눌러 개수를 늘려요.`,plain:`+를 눌러 ${w.qty}개로 맞춰요.`,target:'#qtyPlus'};
  if(d.qty>w.qty) return {text:`${w.qty}개만 필요해요. <b>−</b>를 눌러 줄여요.`,plain:`−를 눌러 ${w.qty}개로 맞춰요.`,target:'#qtyMinus'};
  return {text:'다 맞았어요! <b>장바구니에 담기</b>를 눌러요.',plain:'장바구니에 담기를 눌러요.',target:'#btnAdd'};
}

/* 결과 */
function result(){
  const sec=Math.round((Date.now()-S.t0)/1000), mm=Math.floor(sec/60), ss=sec%60;
  const time=(mm?mm+'분 ':'')+ss+'초';
  const m=M();
  if(!m.items) return {ok:true,html:`<b>주문 성공! 🎉</b><br>걸린 시간: ${time}<br>담았다가 뺀 횟수: ${S.removes}번`};
  const c=cartCheck(), placeOk=S.place===m.place, ok=c.ok&&placeOk;
  const why=[]; if(!placeOk) why.push(`매장/포장 선택이 달라요 (미션: ${m.place==='here'?'매장':'포장'})`); if(!c.ok) why.push('주문한 메뉴나 옵션이 미션과 달라요');
  return {ok,html:ok?`<b>미션 성공! 🎉</b><br>${m.text}<br>걸린 시간: ${time} · 담았다가 뺀 횟수: ${S.removes}번`
    :`<b>아쉬워요, 다시 해 볼까요?</b><br>${why.join('<br>')}<br>걸린 시간: ${time}`};
}

/* ───── 동작 ───── */
const fmtPhone=p=>p.replace(/^(\d{3})(\d{0,4})(\d{0,4}).*/,(a,b,c,d)=>[b,c,d].filter(Boolean).join('-'));
function go(scr){S.screen=scr;render()}
function reset(){Object.assign(S,{screen:'start',place:null,cat:'coffee',cart:[],modal:null,phone:'',phoneOpen:false,removes:0,alert:null});clearAlert();render()}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#screen').appendChild(t);speak(msg,true);setTimeout(()=>t.remove(),2200)}

$('#screen').addEventListener('click',e=>{
  const b=e.target.closest('button,[id=modalBg]'); if(!b) return;
  touched();
  const d=b.dataset, id=b.id;
  if(id==='modalBg'&&e.target===b){S.modal=null;return render()}
  if(id==='btnStart'){S.t0=Date.now();return go('place')}
  if(id==='btnHome'){return reset()}
  if(d.place){S.place=d.place;return go('menu')}
  if(d.cat){S.cat=d.cat;return render()}
  if(d.item){const it=byId(d.item);S.modal={id:it.id,temp:it.temp&&it.temp.length===1?it.temp[0]:null,size:it.size?'R':null,shot:false,qty:1};return render()}
  if(d.temp){S.modal.temp=d.temp;return render()}
  if(d.size){S.modal.size=d.size;return render()}
  if(d.shot){S.modal.shot=!S.modal.shot;return render()}
  if(id==='qtyPlus'){S.modal.qty=Math.min(9,S.modal.qty+1);return render()}
  if(id==='qtyMinus'){S.modal.qty=Math.max(1,S.modal.qty-1);return render()}
  if(id==='btnCancel'){S.modal=null;return render()}
  if(id==='btnAdd'){
    const x=S.modal, same=S.cart.find(l=>l.id===x.id&&l.temp===x.temp&&l.size===x.size&&l.shot===x.shot);
    if(same) same.qty+=x.qty; else S.cart.push({...x});
    const nm=byId(x.id).name; S.modal=null; render(); return toast(`${nm} ${x.qty}개를 담았어요`);}
  if(d.rm!==undefined){S.cart.splice(+d.rm,1);S.removes++;return render()}
  if(id==='btnOrder') return go('confirm');
  if(id==='btnBack') return go('menu');
  if(id==='btnConfirm'){S.phone='';S.phoneOpen=false;return go('point')}
  if(id==='btnPointNo') return go('pay');
  if(id==='btnPointYes'){S.phoneOpen=true;S.phone='010';return render()}
  if(d.key!==undefined){
    if(d.key==='지움') S.phone=S.phone.slice(0,-1);
    else if(d.key==='확인'){ if(S.phone.length<10) return toast('휴대폰 번호를 끝까지 눌러 주세요'); toast('포인트가 적립되었어요'); return go('pay');}
    else if(S.phone.length<11) S.phone+=d.key;
    return render();}
  if(d.pay){ if(d.pay!=='card') return toast('이 연습에서는 카드 결제를 해 볼게요'); return go('card')}
  if(id==='cardSlot'){go('paying');return setTimeout(()=>{if(S.screen==='paying')go('receipt')},2200)}
  if(d.rcpt!==undefined){ if(d.rcpt==='1') toast('영수증이 나왔어요'); S.orderNo=100+Math.floor(Math.random()*900); stopIdle(); return go('done')}
  if(id==='btnAgain') return reset();
  if(id==='btnKeep'){clearAlert();return render()}
});

/* ───── 실전 모드: 가만히 있으면 처음으로 돌아감 (실제 키오스크처럼) ───── */
let idleT=null, cdT=null;
const IDLE=30000;
function touched(){ if(S.mode!=='real'||S.screen==='start'||S.screen==='done') return stopIdle(); clearTimeout(idleT); idleT=setTimeout(showAlert,IDLE)}
function stopIdle(){clearTimeout(idleT);clearAlert()}
function clearAlert(){clearInterval(cdT);S.alert=null}
function showAlert(){
  S.alert={left:10}; render();
  cdT=setInterval(()=>{S.alert.left--; const el=$('#cd'); if(el) el.textContent=S.alert.left;
    if(S.alert.left<=0){clearAlert(); reset(); toast('시간이 지나 처음 화면으로 돌아왔어요')}},1000);
}

/* ───── 음성 안내 ───── */
let lastSaid='';
function speak(t,force){
  if(!S.voice||!t||!('speechSynthesis' in window)) return;
  const clean=t.replace(/<[^>]+>/g,'');
  if(!force&&clean===lastSaid) return; lastSaid=clean;
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(clean); u.lang='ko-KR'; u.rate=.95; speechSynthesis.speak(u);
}

/* ───── 오른쪽 패널 ───── */
function sidePanel(){
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===S.mode));
  $('#modeHint').textContent=S.mode==='practice'?'다음에 누를 버튼이 노랗게 반짝이고, 화면 아래에 안내가 나와요.':'안내 없이 혼자 해 봐요. 30초 동안 아무것도 안 누르면 실제 키오스크처럼 처음으로 돌아가요.';
  $('#missions').innerHTML=MISSIONS.map(m=>`<button class="mis ${m.id===S.mission?'on':''}" data-mis="${m.id}"><small>${m.label}</small>${m.text}</button>`).join('');
  $('#tgVoice').classList.toggle('on',S.voice); $('#tgBig').classList.toggle('on',S.big);
}
$('#modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.mode=b.dataset.mode;reset()});
$('#missions').addEventListener('click',e=>{const b=e.target.closest('[data-mis]');if(!b)return;S.mission=b.dataset.mis;reset()});
$('#tgVoice').onclick=()=>{S.voice=!S.voice;if(!S.voice&&'speechSynthesis' in window)speechSynthesis.cancel();lastSaid='';render()};
$('#tgBig').onclick=()=>{S.big=!S.big;render()};
$('#resetBtn').onclick=reset;

render();
</script>
</body>
